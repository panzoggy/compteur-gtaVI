<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA VI Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-effects">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
        <div class="scanlines"></div>
        <div class="grid-overlay"></div>
        <div class="palm-silhouette palm-left"></div>
        <div class="palm-silhouette palm-right"></div>
        <div class="sun"></div>
    </div>

    <div class="glitch-overlay" aria-hidden="true"></div>

    <main class="container">
        <header class="header">
            <div class="logo">
                <span class="gta">GTA</span>
                <span class="vi">VI</span>
            </div>
            <p class="subtitle">VICE CITY AWAITS</p>
        </header>

        <div class="countdown-card">
            <div class="countdown-title">
                <span class="neon-text">TIME UNTIL RELEASE</span>
                <div class="divider">
                    <span class="divider-line"></span>
                    <span class="divider-dot"></span>
                    <span class="divider-line"></span>
                </div>
            </div>

            <div class="countdown-display" id="countdown">
                <div class="time-unit">
                    <span class="time-value" id="days">000</span>
                    <span class="time-label">DAYS</span>
                </div>
                <div class="separator">:</div>
                <div class="time-unit">
                    <span class="time-value" id="hours">00</span>
                    <span class="time-label">HOURS</span>
                </div>
                <div class="separator">:</div>
                <div class="time-unit">
                    <span class="time-value" id="minutes">00</span>
                    <span class="time-label">MINUTES</span>
                </div>
                <div class="separator">:</div>
                <div class="time-unit">
                    <span class="time-value" id="seconds">00</span>
                    <span class="time-label">SECONDS</span>
                </div>
            </div>

            <div class="milliseconds-display" id="milliseconds">000 ms</div>

            <div class="release-date">
                <span class="date-label">RELEASE DATE</span>
                <span class="date-value">NOVEMBER 19, 2026</span>
            </div>
        </div>

        <footer class="footer">
            <p>NOT AFFILIATED WITH ROCKSTAR GAMES</p>
            <p class="version">v1.0.0 • MADE WITH PASSION</p>
        </footer>
    </main>

    <audio id="tick-sound" preload="auto">
        <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAA" type="audio/wav">
    </audio>

    <script src="script.js"></script>
</body>
</html>
